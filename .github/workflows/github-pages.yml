name: GitHub Pages

on:
  push:
    branches: [main, content-markdown-gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          # Root deploy (custom domain or Pages at /). Do not set NEXT_PUBLIC_BASE_PATH to "/" — Next rejects it.
          NEXT_PUBLIC_SITE_URL: https://mattchaffe.uk
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
